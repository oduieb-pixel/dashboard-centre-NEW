<script>
/**
 * MODULE RESTAURATION · v2 CONTRÔLE DE GESTION
 * Source : getRestauData() -> feuille BDD RESTAU (Reporting Region Centre 2026)
 * Vision Région / entité, coût par nuitée, pont volume-consommation-prix, matrice, écarts vs référence.
 */
var RST = { ix:null, order:{}, jours:[31,30,31], annee:2026, today:new Date(), t:0, period:'T4', ent:'', fam:'',
            sort1:{k:'mnt',d:-1}, sort2:{k:'mnt',d:-1}, ch:{}, userEntity:'ALL', ents:[] };
var RST_MOIS  = ['Octobre','Novembre','Décembre'];
var RST_CITY  = { CSS:'Safi', HIIN:'Marrakech', CIMO:'Essaouira', HPB:'Béni Mellal', CIK:'Khouribga', CIOB:'Benguerir' };
var RST_COLOR = { CSS:'#6366f1', HIIN:'#0ea5e9', CIMO:'#8b5cf6', HPB:'#10b981', CIK:'#f59e0b', CIOB:'#64748b' };
var RST_ENT_ORDER = ['CSS','HIIN','CIMO','HPB','CIK','CIOB'];
var RST_FAMC  = { 'Soins critiques':'#6366f1', 'Hospitalisation':'#0ea5e9', 'Maternité':'#ec4899', 'Ambulatoire':'#f59e0b', 'Hors service':'#94a3b8' };
var RST_FAMS  = ['Soins critiques','Hospitalisation','Maternité','Ambulatoire','Hors service'];
var RST_GOOD = '#10b981', RST_BAD = '#ef4444', RST_NEUT = '#6366f1';

/* ---------- Formats ---------- */
function rInt(n){ return (n===null||n===undefined||isNaN(n)) ? '—' : Math.round(n).toLocaleString('fr-FR'); }
function rDec(n,d){ return (n===null||n===undefined||isNaN(n)) ? '—' : n.toLocaleString('fr-FR',{minimumFractionDigits:d,maximumFractionDigits:d}); }
function rPct(n){ return (n===null||n===undefined||isNaN(n)) ? '—' : Math.round(n*100) + ' %'; }
function rSgn(n,fn){ return (n===null||n===undefined||isNaN(n)) ? '—' : (n>0?'+':(n<0?'−':'')) + fn(Math.abs(n)); }
function rMad(n){
  if (n===null||n===undefined||isNaN(n)) return '—';
  var a = Math.abs(n);
  if (a >= 1e6) return rDec(n/1e6,2) + ' M';
  if (a >= 1e4) return rDec(n/1e3,1) + ' k';
  return rInt(n);
}
function rRel(a,b){ return (a===null||b===null||a===undefined||b===undefined||!(b>0)) ? null : a/b - 1; }
function rShort(s){
  if (s.indexOf('Hospitalisation médico-chirurgicale')===0) return 'HMC';
  if (s.indexOf('Séance Chimiothérapie')===0) return 'Chimio';
  if (s==='Hôpital du jour') return 'HDJ';
  if (s==='Irathérapie Hospit') return 'Irathérapie';
  return s.replace('Réanimation ','Réa ');
}
function rFam(s){
  if (s==='Hors service') return 'Hors service';
  if (/^Réanimation|^USI/.test(s)) return 'Soins critiques';
  if (s==='Maternité') return 'Maternité';
  if (s==='Hôpital du jour' || /^Séance Chimio/.test(s)) return 'Ambulatoire';
  return 'Hospitalisation';
}
function rEsc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function rEl(id){ return document.getElementById(id); }
function rMedian(a){ if (!a.length) return null; a = a.slice().sort(function(x,y){ return x-y; }); var m = Math.floor(a.length/2); return a.length%2 ? a[m] : (a[m-1]+a[m])/2; }

/* ---------- Chargement ---------- */
function rstLoad(force){
  if (!force && RST.ix && (Date.now() - RST.t) < 120000) { rstRender(); return; }
  var btn = rEl('rstRefreshBtn'); if (btn) btn.classList.add('spin');
  if (typeof showLoadingOverlay === 'function') showLoadingOverlay('Chargement Restauration…');
  google.script.run
    .withSuccessHandler(function(res){
      if (typeof hideLoadingOverlay === 'function') hideLoadingOverlay();
      if (btn) btn.classList.remove('spin');
      rstIngest(res);
    })
    .withFailureHandler(function(err){
      if (typeof hideLoadingOverlay === 'function') hideLoadingOverlay();
      if (btn) btn.classList.remove('spin');
      rstShowEmpty('Erreur de chargement : ' + (err && err.message ? err.message : err));
    })
    .getRestauData(!!force);
}
window.loadRestauData = function(){ rstLoad(false); };

function rstShowEmpty(msg){
  rEl('rstEmpty').style.display = 'block';
  rEl('rstEmptyMsg').textContent = msg;
  rEl('rstBody').style.display = 'none';
}

function rstKey(ind, s){
  var n = ind.toLowerCase();
  if (s === 'Entité') {
    if (n.indexOf('montant contrat') === 0) return 'eMnt';
    if (n.indexOf('montant facturé') === 0) return 'eFac';
    if (n.indexOf('lignes en écart') === 0) return 'eLig';
    if (n.indexOf('écart') === 0) return 'eEc';
    return null;
  }
  if (n.indexOf('activité') === 0) return 'act';
  if (n === 'repas patients hors collations') return 'rep';
  if (n === 'collations') return 'col';
  if (n === 'menus améliorés') return 'men';
  if (n === 'montant contrat ht') return 'mnt';
  if (n === 'jours saisis') return 'js';
  if (n === 'saisi par') return 'par';
  return null;
}

function rstIngest(res){
  if (!res || res.error) { rstShowEmpty(res && res.error ? res.error : 'Aucune réponse du serveur.'); return; }
  var rows = res.rows || [], ix = {}, order = {}, hasNum = false;
  rows.forEach(function(r){
    var k = rstKey(r.i, r.s); if (!k) return;
    ix[r.e] = ix[r.e] || {}; order[r.e] = order[r.e] || [];
    if (!ix[r.e][r.s]) { ix[r.e][r.s] = {}; if (r.s !== 'Entité') order[r.e].push(r.s); }
    var t = ix[r.e][r.s]; t[k] = r.v;
    if (k === 'act') t.unit = r.u || (/passage/i.test(r.i) ? 'Passages' : 'Nuitées');
    if (k !== 'par' && k !== 'js') r.v.forEach(function(x){ if (typeof x === 'number') hasNum = true; });
  });
  RST.ix = ix; RST.order = order; RST.jours = res.jours || [31,30,31]; RST.annee = res.annee || 2026;
  RST.userEntity = res.userEntity || 'ALL'; RST.t = Date.now();
  var p = String(res.today || '').split('-');
  RST.today = p.length === 3 ? new Date(+p[0], +p[1]-1, +p[2]) : new Date();
  rEl('rstLastUpdate').textContent = "Date d'actualisation : " + (res.updated || '--') + (res.fromCache ? ' (cache)' : '');
  if (!rows.length || !hasNum) {
    rstShowEmpty("La feuille BDD RESTAU ne renvoie aucune valeur. Vérifiez dans « Reporting Region Centre 2026 » que les liens de LIEN RESTAU sont renseignés et que l'accès IMPORTRANGE est autorisé pour chaque fichier mensuel.");
    return;
  }
  rEl('rstEmpty').style.display = 'none'; rEl('rstBody').style.display = 'block';
  var ents = RST_ENT_ORDER.filter(function(e){ return ix[e]; });
  Object.keys(ix).forEach(function(e){ if (ents.indexOf(e) < 0) ents.push(e); });
  RST.ents = ents;
  if (ents.length === 1) RST.ent = ents[0];
  rstPills();
  rstRender();
}

function rstPills(){
  var h = '';
  if (RST.ents.length > 1) h += '<button class="rst-pill' + (RST.ent === '' ? ' active' : '') + '" data-ent="">Région Centre</button>';
  RST.ents.forEach(function(e){
    h += '<button class="rst-pill' + (RST.ent === e ? ' active' : '') + '" data-ent="' + e + '"><span class="rst-dot" style="background:' + (RST_COLOR[e]||'#64748b') + ';margin:0"></span>' + e + ' <small>' + (RST_CITY[e]||'') + '</small></button>';
  });
  var box = rEl('rstPills'); box.innerHTML = h;
  box.onclick = function(ev){
    var b = ev.target.closest ? ev.target.closest('.rst-pill') : null; if (!b) return;
    RST.ent = b.getAttribute('data-ent'); rstPills(); rstRender();
  };
}

/* ---------- Filtres ---------- */
function rstSetPeriod(p){
  RST.period = p;
  var bs = document.querySelectorAll('#rstSeg button');
  for (var i = 0; i < bs.length; i++) bs[i].classList.toggle('active', bs[i].getAttribute('data-p') === p);
  rstRender();
}
function rstApplyFilters(){ RST.fam = rEl('rstFilterFam').value; rstRender(); }
function rstReset(){
  RST.period = 'T4'; RST.fam = ''; if (RST.ents.length > 1) RST.ent = '';
  rEl('rstFilterFam').value = ''; rEl('rstSearch').value = '';
  var bs = document.querySelectorAll('#rstSeg button');
  for (var i = 0; i < bs.length; i++) bs[i].classList.toggle('active', bs[i].getAttribute('data-p') === 'T4');
  rstPills(); rstRender();
}

/* ---------- Calculs ---------- */
function rMs(){ return RST.period === 'T4' ? [0,1,2] : [parseInt(RST.period,10)]; }
function rSum(arr, ms){
  if (!arr) return null;
  var t = 0, any = false;
  ms.forEach(function(m){ if (typeof arr[m] === 'number') { t += arr[m]; any = true; } });
  return any ? t : null;
}
function rElapsed(m){
  var start = new Date(RST.annee, 9 + m, 1);
  var d = Math.floor((RST.today - start) / 86400000) + 1;
  return Math.max(0, Math.min(RST.jours[m], d));
}
function rDays(ms){ var t = 0; ms.forEach(function(m){ t += RST.jours[m]; }); return t; }
function rExp(ms){ var t = 0; ms.forEach(function(m){ t += rElapsed(m); }); return t; }
function rPeriodLabel(ms){ return ms.length === 3 ? 'T4 2026' : RST_MOIS[ms[0]] + ' 2026'; }

function rEnts(all){ return (all || !RST.ent) ? RST.ents : RST.ents.filter(function(e){ return e === RST.ent; }); }

function rSvc(e, s, ms){
  var t = RST.ix[e][s], exp = rExp(ms);
  var a = { e:e, s:s, fam:rFam(s), hs:(s==='Hors service'), unit:t.unit||'', act:rSum(t.act,ms), rep:rSum(t.rep,ms), col:rSum(t.col,ms),
            men:rSum(t.men,ms), mnt:rSum(t.mnt,ms), js:rSum(t.js,ms)||0, exp:exp };
  a.pass = /passage/i.test(a.unit);
  a.prest = (a.rep===null && a.col===null && a.men===null) ? null : (a.rep||0) + (a.col||0) + (a.men||0);
  a.ratio = (a.act > 0 && a.rep !== null) ? a.rep / a.act : null;
  a.cout  = (a.act > 0 && a.mnt > 0) ? a.mnt / a.act : null;
  a.prestU = (a.act > 0 && a.prest !== null) ? a.prest / a.act : null;
  a.prix  = (a.prest > 0 && a.mnt > 0) ? a.mnt / a.prest : null;
  a.cov   = exp ? Math.min(1, a.js / exp) : 0;
  return a;
}

// Agrégat sur une liste d'entités (et éventuellement un service précis)
function rCompute(ms, ents, svc){
  ents = ents || rEnts();
  var c = { nui:null, pas:null, rep:null, repN:null, col:null, men:null, prest:null, mnt:null, fac:null, ec:null, lig:null,
            js:0, slots:0, exp:rExp(ms), P:[] };
  function add(k, v){ if (v === null || v === undefined) return; c[k] = (c[k] || 0) + v; }
  var entLevel = !svc && !RST.fam;
  ents.forEach(function(e){
    RST.order[e].forEach(function(s){
      if (svc && s !== svc) return;
      var a = rSvc(e, s, ms);
      if (!svc && RST.fam && a.fam !== RST.fam) return;
      c.P.push(a); c.js += a.js; c.slots++;
      if (!a.hs) {
        if (a.pass) add('pas', a.act); else { add('nui', a.act); add('repN', a.rep); }
        add('rep', a.rep); add('col', a.col); add('men', a.men); add('prest', a.prest);
      }
    });
    if (entLevel) {
      var t = RST.ix[e]['Entité'] || {}, m = rSum(t.eMnt, ms);
      if (m === null) RST.order[e].forEach(function(s){ add('mnt', rSum(RST.ix[e][s].mnt, ms)); }); else add('mnt', m);
      add('fac', rSum(t.eFac, ms)); add('ec', rSum(t.eEc, ms)); add('lig', rSum(t.eLig, ms));
    }
  });
  if (!entLevel) c.P.forEach(function(a){ add('mnt', a.mnt); });
  c.mode = (c.nui > 0 || !(c.pas > 0)) ? 'n' : 'p';
  c.act = c.mode === 'n' ? c.nui : c.pas;
  c.repM = c.mode === 'n' ? c.repN : c.rep;
  c.ratio = (c.act > 0 && c.repM !== null) ? c.repM / c.act : null;
  c.cout = (c.act > 0 && c.mnt > 0) ? c.mnt / c.act : null;
  c.prestU = (c.act > 0 && c.prest !== null) ? c.prest / c.act : null;
  c.prix = (c.prest > 0 && c.mnt > 0) ? c.mnt / c.prest : null;
  c.cov = (c.slots && c.exp) ? Math.min(1, c.js / (c.slots * c.exp)) : 0;
  c.has = (c.act !== null || c.rep !== null || c.mnt !== null);
  return c;
}
function rRef(ms){ return rCompute(ms, rEnts(true)); }

// Dimensions d'analyse : entités (vision Région) ou services (vision entité)
function rDims(ms){
  var out = [];
  if (!RST.ent) {
    rEnts(true).forEach(function(e){
      var c = rCompute(ms, [e]);
      out.push({ k:e, label:e, sub:RST_CITY[e]||'', color:RST_COLOR[e]||'#64748b', c:c, e:e });
    });
  } else {
    RST.order[RST.ent].forEach(function(s){
      if (RST.fam && rFam(s) !== RST.fam) return;
      var c = rCompute(ms, [RST.ent], s);
      out.push({ k:s, label:rShort(s) + (c.mode==='p' && !c.nui ? ' (passage)' : ''), sub:rFam(s), color:RST_FAMC[rFam(s)], c:c, e:RST.ent, s:s });
    });
  }
  return out;
}
// Référence par service = médiane des entités (≥3 valeurs)
function rSvcMed(ms){
  var by = {};
  RST.ents.forEach(function(e){ RST.order[e].forEach(function(s){
    var a = rSvc(e, s, ms); if (a.hs) return;
    var o = by[s] = by[s] || { c:[], r:[], p:[] };
    if (a.cout !== null) o.c.push(a.cout); if (a.ratio !== null) o.r.push(a.ratio); if (a.prix !== null) o.p.push(a.prix);
  }); });
  var med = {};
  Object.keys(by).forEach(function(s){ med[s] = { c: by[s].c.length>=3 ? rMedian(by[s].c) : null, r: by[s].r.length>=3 ? rMedian(by[s].r) : null, p: by[s].p.length>=3 ? rMedian(by[s].p) : null }; });
  return med;
}
function rDimRef(d, ref, med){
  if (!RST.ent) return ref.cout;
  var m = med[d.s]; return m ? m.c : null;
}

/* ---------- Rendu ---------- */
function rstRender(){
  if (!RST.ix) return;
  var ms = rMs(), c = rCompute(ms), ref = rRef(ms), prev = null, m = ms.length === 1 ? ms[0] : -1;
  if (m > 0) { var pc = rCompute([m-1]); if (pc.has) prev = pc; }
  var scope = RST.ent ? '<b>' + RST.ent + '</b> · ' + (RST_CITY[RST.ent]||'') : '<b>Région Centre</b> · ' + RST.ents.length + ' entités';
  rEl('rstScope').innerHTML = 'Périmètre : ' + scope + ' &nbsp;·&nbsp; Période : <b>' + rPeriodLabel(ms) + '</b>' + (RST.fam ? ' &nbsp;·&nbsp; Famille : <b>' + RST.fam + '</b>' : '');
  rstKpis(c, ref, prev, ms);
  rstStrip(c, ms);
  rstCharts(ms, c, ref);
  rstRenderTable1(ms, c, ref);
  rstRenderTable2();
}

/* ---------- KPI ---------- */
function rCount(el, to, fmt){
  if (!el) return;
  if (to === null || to === undefined || isNaN(to)) { el.textContent = '—'; el._v = null; return; }
  var from = (typeof el._v === 'number') ? el._v : 0, t0 = performance.now(), dur = 700;
  el._v = to;
  function step(t){
    var k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    el.innerHTML = fmt(from + (to - from) * e);
    if (k < 1) requestAnimationFrame(step); else el.innerHTML = fmt(to);
  }
  requestAnimationFrame(step);
}
// delta : badChange=true -> une hausse est défavorable (coûts)
function rDelta(cur, prev, badUp){
  var d = rRel(cur, prev); if (d === null) return '';
  var cls = Math.abs(d) < 0.005 ? 'eq' : ((d > 0) === !!badUp ? 'badd' : 'good');
  return '<span class="rst-delta ' + cls + '">' + (d >= 0 ? '+' : '−') + Math.abs(Math.round(d * 100)) + ' %</span>';
}
function rVsRef(cur, ref, dec, unit){
  if (RST.ent === '' || cur === null || ref === null) return '';
  var d = rRel(cur, ref); if (d === null) return '';
  var cls = Math.abs(d) < 0.03 ? 'eq' : (d > 0 ? 'badd' : 'good');
  return '<span class="rst-delta ' + cls + '">' + rSgn(d * 100, function(x){ return Math.round(x); }) + ' %</span> vs région (' + rDec(ref, dec) + (unit ? ' ' + unit : '') + ')';
}
function rstKpis(c, ref, prev, ms){
  var m = ms.length === 1 ? ms[0] : -1, u = c.mode === 'n' ? 'nuitée' : 'passage';
  var vs = m > 0 ? ' vs ' + RST_MOIS[m-1].toLowerCase() : '';
  var per = m < 0 ? 'Cumul T4 2026' : RST_MOIS[m] + ' 2026';
  rEl('rT1').textContent = c.mode === 'n' ? 'Nuitées' : 'Passages';
  rEl('rT4').textContent = 'Coût HT par ' + u;
  rEl('rT5').textContent = 'Repas par ' + u;

  rCount(rEl('rK1'), c.act, rInt);
  rEl('rK1s').innerHTML = (prev ? rDelta(c.act, prev.act, false) + vs : per) + (c.mode === 'n' && c.pas > 0 ? '<br>+ ' + rInt(c.pas) + ' passages (HDJ, chimio)' : '');
  rCount(rEl('rK2'), c.rep, rInt);
  rEl('rK2s').innerHTML = (prev ? rDelta(c.rep, prev.rep, false) + vs + '<br>' : '') + 'Collations ' + rInt(c.col) + ' · Menus améliorés ' + rInt(c.men);
  rCount(rEl('rK3'), c.mnt, function(x){ return rMad(x) + '<small>MAD</small>'; });
  var share = (RST.ent && ref.mnt > 0 && c.mnt !== null) ? rPct(c.mnt / ref.mnt) + ' du montant région' : '';
  rEl('rK3s').innerHTML = (prev ? rDelta(c.mnt, prev.mnt, true) + vs + '<br>' : '') + share;
  rCount(rEl('rK4'), c.cout, function(x){ return rDec(x, 1) + '<small>MAD</small>'; });
  rEl('rK4s').innerHTML = (prev && prev.cout ? rDelta(c.cout, prev.cout, true) + vs + '<br>' : '') + (rVsRef(c.cout, ref.cout, 1, 'MAD') || (c.cout === null ? 'Grille tarifaire ou activité manquante' : 'Montant contrat HT / ' + u));
  rCount(rEl('rK5'), c.ratio, function(x){ return rDec(x, 2); });
  rEl('rK5s').innerHTML = (prev && prev.ratio ? rDelta(c.ratio, prev.ratio, true) + vs + '<br>' : '') + (rVsRef(c.ratio, ref.ratio, 2, '') || 'Repas patients hors collations');
  rCount(rEl('rK6'), c.prix, function(x){ return rDec(x, 1) + '<small>MAD</small>'; });
  rEl('rK6s').innerHTML = (prev && prev.prix ? rDelta(c.prix, prev.prix, true) + vs + '<br>' : '') + (rVsRef(c.prix, ref.prix, 1, 'MAD') || 'Montant / (repas + collations + menus)');
}
function rstStrip(c, ms){
  var unit = c.mode === 'n' ? 'nuitée' : 'passage';
  var items = [
    { i:'fa-file-invoice', c:'#f59e0b', bg:'#fffbeb', t:'Facturé HT', v:(c.fac !== null && !RST.fam) ? rMad(c.fac) + ' MAD' : '—', s:(RST.fam ? 'Disponible toutes familles' : 'Montant facturé') },
    { i:'fa-scale-unbalanced', c:(c.ec > 0 ? '#ef4444' : '#10b981'), bg:(c.ec > 0 ? '#fef2f2' : '#f0fdf4'), t:'Écart facturation', v:(c.ec !== null && !RST.fam) ? rSgn(c.ec, rMad) + ' MAD' : '—', s:(c.lig ? rInt(c.lig) + ' ligne(s) en écart' : 'Facturé − contrat') },
    { i:'fa-mug-hot', c:'#0ea5e9', bg:'#f0f9ff', t:'Collations par ' + unit, v:(c.act > 0 && c.col !== null) ? rDec(c.col / c.act, 2) : '—', s:rInt(c.col) + ' collations' },
    { i:'fa-star', c:'#8b5cf6', bg:'#f5f3ff', t:'Part menus améliorés', v:(c.prest > 0 && c.men !== null) ? rDec(c.men / c.prest * 100, 1) + ' %' : '—', s:rInt(c.men) + ' menus améliorés' },
    { i:'fa-database', c:'#64748b', bg:'#f1f5f9', t:'Couverture des données', v:c.exp ? rPct(c.cov) : '—', s:'Jours renseignés / jours écoulés' }
  ];
  rEl('rstStrip').innerHTML = items.map(function(x){
    return '<div class="rst-mini" style="--c:' + x.c + ';--bg:' + x.bg + '"><div><b>' + x.t + '</b><span>' + x.v + '</span><em>' + x.s + '</em></div></div>';
  }).join('');
}

/* ---------- Plugins graphiques ---------- */
var rLbl = { id:'rLbl', afterDatasetsDraw:function(ch){
  var ctx = ch.ctx, horiz = ch.options.indexAxis === 'y';
  ch.data.datasets.forEach(function(ds, di){
    var o = ds.rl; if (!o || !ch.isDatasetVisible(di)) return;
    var meta = ch.getDatasetMeta(di);
    meta.data.forEach(function(el, i){
      var raw = ds.data[i]; if (raw === null || raw === undefined) return;
      var v = o.vals ? o.vals[i] : raw; if (v === null || v === undefined || (typeof v === 'number' && isNaN(v))) return;
      var txt = o.fmt(v, i); if (!txt) return;
      var x, y;
      ctx.save(); ctx.font = '700 ' + (o.size || 11) + "px 'Plus Jakarta Sans', sans-serif";
      ctx.fillStyle = typeof o.color === 'function' ? o.color(i) : (o.color || '#334155');
      if (meta.type === 'bar') {

  th.innerHTML = cols.map(function(c){ return '<th class="' + (c.l ? 'l' : '') + '" data-k="' + c.k + '">' + c.t + '<span class="ar">' + (RST[sortKey].k === c.k ? (RST[sortKey].d > 0 ? '▲' : '▼') : '') + '</span></th>'; }).join('');
  th.onclick = function(ev){ var h = ev.target.closest ? ev.target.closest('th') : null; if (!h) return; var k = h.getAttribute('data-k'); RST[sortKey] = { k:k, d:RST[sortKey].k === k ? -RST[sortKey].d : -1 }; fn(); };
}
function rstRenderTable1(ms, c, ref){
  var dims = rDims(ms).filter(function(d){ return d.c.has; }), med = rSvcMed(ms), tot = c.mnt || 0;
  rEl('rstTT1').textContent = RST.ent ? 'Comparatif des services · ' + RST.ent : 'Comparatif des entités';
  var rows = dims.map(function(d){
    var r = rDimRef(d, ref, med), x = d.c;
    return { d:d, label:d.label, act:x.act, rep:x.repM, ratio:x.ratio, prestU:x.prestU, prix:x.prix, mnt:x.mnt, part:tot > 0 && x.mnt ? x.mnt / tot : null, cout:x.cout,
      ecart:(r && x.cout !== null) ? rRel(x.cout, r) : null, surcout:(r && x.cout !== null && x.act > 0) ? (x.cout - r) * x.act : null, fac:x.fac, ec:x.ec };
  });
  var k = RST.sort1.k, dd = RST.sort1.d;
  rows.sort(function(a, b){ var x = a[k], y = b[k]; if (x === null || x === undefined) x = -Infinity; if (y === null || y === undefined) y = -Infinity; if (typeof x === 'string' || typeof y === 'string') return String(x).localeCompare(String(y), 'fr') * dd; return (x - y) * dd; });
  var cols = RST_C1.slice(); cols[0] = { k:'label', t:RST.ent ? 'Service' : 'Entité', l:1 };
  rBind('rstThead1', cols, 'sort1', function(){ rstRenderTable1(ms, c, ref); });
  function chip(v){ if (v === null) return '—'; var cl = Math.abs(v) < 0.03 ? 'eq' : (v > 0 ? 'up' : 'dn'); return '<span class="rst-chip ' + cl + '">' + rSgn(v * 100, function(x){ return Math.round(x); }) + ' %</span>'; }
  var h = rows.map(function(r){
    var lab = RST.ent ? '<span class="rst-dot" style="background:' + r.d.color + '"></span>' + rEsc(r.label) : '<span class="rst-ent" style="background:' + r.d.color + '">' + rEsc(r.label) + '</span> <small style="color:#94a3b8">' + rEsc(r.d.sub) + '</small>';
    return '<tr class="dr" data-e="' + r.d.e + '" ' + (r.d.s ? 'data-s="' + rEsc(r.d.s) + '"' : '') + '><td class="l sv">' + lab + '</td><td>' + rInt(r.act) + '</td><td>' + rInt(r.rep) + '</td><td>' + rDec(r.ratio, 2) + '</td><td>' + rDec(r.prestU, 2) + '</td><td>' + rDec(r.prix, 1) + '</td><td>' + rInt(r.mnt) + '</td><td>' + rPct(r.part) + '</td><td><b>' + rDec(r.cout, 1) + '</b></td><td>' + chip(r.ecart) + '</td><td style="color:' + (r.surcout > 0 ? '#b91c1c' : r.surcout < 0 ? '#15803d' : '#334155') + '">' + rSgn(r.surcout, rInt) + '</td><td>' + (r.fac ? rInt(r.fac) : '—') + '</td><td style="color:' + (r.ec > 0 ? '#b91c1c' : '#334155') + '">' + (r.ec !== null && r.fac ? rSgn(r.ec, rInt) : '—') + '</td></tr>';
  }).join('');
  h += '<tr class="tot"><td class="l">' + (RST.ent ? 'Total ' + RST.ent : 'Total Région') + '</td><td>' + rInt(c.act) + '</td><td>' + rInt(c.repM) + '</td><td>' + rDec(c.ratio, 2) + '</td><td>' + rDec(c.prestU, 2) + '</td><td>' + rDec(c.prix, 1) + '</td><td>' + rInt(c.mnt) + '</td><td>100 %</td><td>' + rDec(c.cout, 1) + '</td><td></td><td></td><td>' + (c.fac && !RST.fam ? rInt(c.fac) : '—') + '</td><td>' + (c.ec !== null && !RST.fam ? rSgn(c.ec, rInt) : '—') + '</td></tr>';
  rEl('rstTbody1').innerHTML = h;
  rEl('rstTbody1').onclick = function(ev){
    var tr = ev.target.closest ? ev.target.closest('tr.dr') : null; if (!tr) return;
    if (tr.getAttribute('data-s')) rstOpen(tr.getAttribute('data-e'), tr.getAttribute('data-s'));
    else { RST.ent = tr.getAttribute('data-e'); rstPills(); rstRender(); window.scrollTo && rEl('rstPills').scrollIntoView({ behavior:'smooth', block:'start' }); }
  };
}

/* ---------- Détail par service ---------- */
var RST_C2 = [
  { k:'e', t:'Entité', l:1 }, { k:'s', t:'Service', l:1 }, { k:'fam', t:'Famille', l:1 }, { k:'act', t:'Activité' }, { k:'rep', t:'Repas' }, { k:'ratio', t:'Repas / unité' },
  { k:'col', t:'Collations' }, { k:'men', t:'Menus amél.' }, { k:'mnt', t:'Montant HT' }, { k:'cout', t:'Coût / unité' }, { k:'prix', t:'Prix moyen' }, { k:'cov', t:'Données' }
];
function rstRenderTable2(){
  if (!RST.ix) return;
  var ms = rMs(), P = rCompute(ms).P, q = (rEl('rstSearch').value || '').toLowerCase().trim(), med = rSvcMed(ms);
  if (q) P = P.filter(function(a){ return (a.e + ' ' + a.s + ' ' + rShort(a.s) + ' ' + a.fam).toLowerCase().indexOf(q) > -1; });
  var k = RST.sort2.k, d = RST.sort2.d;
  P = P.slice().sort(function(a, b){ var x = a[k], y = b[k]; if (x === null || x === undefined) x = (typeof y === 'string') ? '' : -Infinity; if (y === null || y === undefined) y = (typeof x === 'string') ? '' : -Infinity; if (typeof x === 'string' || typeof y === 'string') return String(x).localeCompare(String(y), 'fr') * d; return (x - y) * d; });
  rBind('rstThead2', RST_C2, 'sort2', rstRenderTable2);
  rEl('rstTbody2').innerHTML = P.map(function(a){
    var m = med[a.s] || {}, fr = '', fc = '';
    if (m.r && a.ratio !== null && Math.abs(a.ratio / m.r - 1) > 0.25) fr = '<span class="rst-flag" title="Écart supérieur à 25 % de la médiane des entités (' + rDec(m.r, 2) + ')">&#9679;</span>';
    if (m.c && a.cout !== null && Math.abs(a.cout / m.c - 1) > 0.25) fc = '<span class="rst-flag" title="Écart supérieur à 25 % de la médiane des entités (' + rDec(m.c, 1) + ' MAD)">&#9679;</span>';
    var cc = a.cov >= 0.9 ? '#10b981' : a.cov > 0 ? '#f59e0b' : '#cbd5e1';
    return '<tr class="dr" data-e="' + a.e + '" data-s="' + rEsc(a.s) + '"><td class="l"><span class="rst-ent" style="background:' + (RST_COLOR[a.e]||'#64748b') + '">' + a.e + '</span></td><td class="l sv">' + rEsc(rShort(a.s)) + '</td><td class="l"><span class="rst-dot" style="background:' + RST_FAMC[a.fam] + '"></span>' + a.fam + '</td>' +
      '<td>' + (a.hs ? '—' : rInt(a.act) + ' <small style="color:#94a3b8">' + (a.pass ? 'pass.' : 'nuit.') + '</small>') + '</td><td>' + (a.hs ? '—' : rInt(a.rep)) + '</td><td>' + rDec(a.ratio, 2) + fr + '</td><td>' + (a.hs ? '—' : rInt(a.col)) + '</td><td>' + (a.hs ? '—' : rInt(a.men)) + '</td><td>' + rInt(a.mnt) + '</td><td><b>' + rDec(a.cout, 1) + '</b>' + fc + '</td><td>' + rDec(a.prix, 1) + '</td>' +
      '<td><span class="rst-dot" style="background:' + cc + '" title="' + a.js + ' jour(s) renseigné(s) sur ' + a.exp + '"></span>' + rPct(a.cov) + '</td></tr>';
  }).join('') || '<tr><td colspan="12" style="text-align:center;padding:30px;color:#94a3b8">Aucune ligne</td></tr>';
  rEl('rstCount').textContent = P.length + ' ligne(s)';
  rEl('rstTbody2').onclick = function(ev){ var tr = ev.target.closest ? ev.target.closest('tr.dr') : null; if (tr) rstOpen(tr.getAttribute('data-e'), tr.getAttribute('data-s')); };
}

/* ---------- Détail service (modale) ---------- */
function rstOpen(e, s){
  if (!RST.ix || !RST.ix[e] || !RST.ix[e][s]) return;
  var a = rSvc(e, s, rMs()), t = RST.ix[e][s], med = rSvcMed(rMs())[s] || {};
  rEl('rstMTitle').textContent = e + ' · ' + (RST_CITY[e] || '') + ' — ' + s;
  function box(l, v){ return '<div class="rst-mm"><b>' + l + '</b><span>' + v + '</span></div>'; }
  rEl('rstMGrid').innerHTML = box(a.pass ? 'Passages' : 'Nuitées', a.hs ? '—' : rInt(a.act)) + box('Repas patients', a.hs ? '—' : rInt(a.rep)) + box('Repas / ' + (a.pass ? 'passage' : 'nuitée'), rDec(a.ratio, 2)) +
    box('Montant HT', rInt(a.mnt) + ' MAD') + box('Coût / unité', rDec(a.cout, 1) + (med.c ? ' <small style="font-size:.6em;color:#94a3b8">méd. ' + rDec(med.c, 1) + '</small>' : '')) + box('Prix moyen / prestation', rDec(a.prix, 1));
  rEl('rstModal').style.display = 'flex';
  rKill('modal');
  if (typeof Chart === 'undefined') return;
  function mv(arr, m){ return arr && typeof arr[m] === 'number' ? arr[m] : null; }
  var cout = [0,1,2].map(function(m){ var x = rSvc(e, s, [m]); return x.cout; });
  RST.ch.modal = new Chart(rEl('rstChModal'), {
    data:{ labels:RST_MOIS, datasets:[
      { type:'bar', label:(a.pass ? 'Passages' : 'Nuitées'), data:[0,1,2].map(function(m){ return mv(t.act, m); }), backgroundColor:'rgba(14,165,233,.85)', borderRadius:8, rl:{ pos:'end', fmt:rInt } },
      { type:'bar', label:'Repas patients', data:[0,1,2].map(function(m){ return mv(t.rep, m); }), backgroundColor:'rgba(99,102,241,.85)', borderRadius:8, rl:{ pos:'end', fmt:rInt } },
      { type:'line', label:'Coût HT / unité (MAD)', data:cout, borderColor:'#f59e0b', backgroundColor:'#f59e0b', borderWidth:3, tension:.3, pointRadius:5, yAxisID:'y1', spanGaps:false, rl:{ color:'#b45309', fmt:function(v){ return rDec(v, 1); } } } ] },
    options:{ responsive:true, maintainAspectRatio:false, layout:{ padding:{ top:18 } }, plugins:{ legend:rLegend(), datalabels:{ display:false } },
      scales:{ y:{ beginAtZero:true, grid:R_GRID, ticks:R_AX }, y1:{ position:'right', beginAtZero:true, grid:{ display:false }, ticks:R_AX }, x:{ grid:{ display:false }, ticks:{ color:'#1e293b', font:{ size:12, weight:'800' } } } } },
    plugins:[rLbl]
  });
}
function rstCloseModal(){ rEl('rstModal').style.display = 'none'; rKill('modal'); }
document.addEventListener('keydown', function(ev){ if (ev.key === 'Escape') rstCloseModal(); });

/* ---------- Export ---------- */
function rstExport(){
  if (!RST.ix) return;
  var ms = rMs(), c = rCompute(ms), ref = rRef(ms), med = rSvcMed(ms), dims = rDims(ms);
  var r1 = [[RST.ent ? 'Service' : 'Entité','Activité','Repas hors collations','Repas / unité','Prestations / unité','Prix moyen / prestation','Montant HT (MAD)','Coût HT / unité','Écart vs référence (%)','Surcoût vs référence (MAD)','Facturé HT','Écart facturation']];
  dims.forEach(function(d){ var x = d.c, r = rDimRef(d, ref, med); r1.push([d.label, x.act, x.repM, x.ratio, x.prestU, x.prix, x.mnt, x.cout, (r && x.cout !== null) ? Math.round(rRel(x.cout, r) * 1000) / 10 : '', (r && x.cout !== null && x.act > 0) ? Math.round((x.cout - r) * x.act) : '', x.fac, x.ec]); });
  var r2 = [['Entité','Service','Famille','Unité','Activité','Repas hors collations','Collations','Menus améliorés','Montant HT (MAD)','Coût HT / unité','Prix moyen','Jours renseignés','Jours écoulés']];
  c.P.forEach(function(a){ r2.push([a.e, a.s, a.fam, a.pass ? 'Passages' : 'Nuitées', a.act, a.rep, a.col, a.men, a.mnt, a.cout, a.prix, a.js, a.exp]); });
  var r3 = [['Entité','Service','Mois','Activité','Repas hors collations','Collations','Menus améliorés','Montant HT (MAD)']];
  rEnts().forEach(function(e){ RST.order[e].forEach(function(s){ if (RST.fam && rFam(s) !== RST.fam) return; var t = RST.ix[e][s];
    [0,1,2].forEach(function(m){ function g(arr){ return arr && typeof arr[m] === 'number' ? arr[m] : ''; } r3.push([e, s, RST_MOIS[m], g(t.act), g(t.rep), g(t.col), g(t.men), g(t.mnt)]); }); }); });
  var wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(r1), 'Comparatif');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(r2), 'Services');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(r3), 'Mensuel');
  XLSX.writeFile(wb, 'Suivi_Restauration_' + (ms.length === 3 ? 'T4' : RST_MOIS[ms[0]]) + '_2026.xlsx');
}
</script>
