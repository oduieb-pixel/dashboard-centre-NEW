<script>
/**
 * MODULE RESTAURATION · v1
 * Source : getRestauData() -> feuille BDD RESTAU (Reporting Region Centre 2026)
 * Pulse de saisie, KPI, tendance, comparaison d'entités, mix, tableau détaillé, synthèse.
 */
var RST = {
  ix: null, order: {}, jours: [31,30,31], annee: 2026, today: new Date(), t: 0,
  period: 'T4', ent: '', svc: '', sort: { k: 'mnt', d: -1 }, ch: {}, userEntity: 'ALL'
};
var RST_MOIS   = ['Octobre','Novembre','Décembre'];
var RST_CITY   = { CSS:'Safi', HIIN:'Marrakech', CIMO:'Essaouira', HPB:'Béni Mellal', CIK:'Khouribga', CIOB:'Benguerir' };
var RST_COLOR  = { CSS:'#6366f1', HIIN:'#0ea5e9', CIMO:'#8b5cf6', HPB:'#10b981', CIK:'#f59e0b', CIOB:'#64748b' };
var RST_ENT_ORDER = ['CSS','HIIN','CIMO','HPB','CIK','CIOB'];
var RST_PAL    = ['#6366f1','#0ea5e9','#8b5cf6','#10b981','#f59e0b','#ef4444','#14b8a6','#ec4899','#94a3b8'];
var RST_TOL    = 0.90; // un service est "à jour" s'il a au moins 90 % des jours attendus

/* ---------- Formats ---------- */
function rInt(n){ return (n===null||n===undefined||isNaN(n)) ? '—' : Math.round(n).toLocaleString('fr-FR'); }
function rDec(n,d){ return (n===null||n===undefined||isNaN(n)) ? '—' : n.toLocaleString('fr-FR',{minimumFractionDigits:d,maximumFractionDigits:d}); }
function rPct(n){ return (n===null||n===undefined||isNaN(n)) ? '—' : Math.round(n*100) + ' %'; }
function rMad(n){
  if (n===null||n===undefined||isNaN(n)) return '—';
  var a = Math.abs(n);
  if (a >= 1e6) return rDec(n/1e6,2) + ' M';
  if (a >= 1e4) return rDec(n/1e3,1) + ' k';
  return rInt(n);
}
function rShort(s){
  if (s.indexOf('Hospitalisation médico-chirurgicale')===0) return 'HMC';
  if (s.indexOf('Séance Chimiothérapie')===0) return 'Chimio';
  if (s==='Hôpital du jour') return 'HDJ';
  if (s==='Irathérapie Hospit') return 'Irathérapie';
  return s.replace('Réanimation ','Réa ');
}
function rEsc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function rEl(id){ return document.getElementById(id); }

/* ---------- Chargement ---------- */
function rstLoad(force){
  if (!force && RST.ix && (Date.now() - RST.t) < 120000) { rstRender(); return; }
  var btn = rEl('rstRefreshBtn'); if (btn) btn.classList.add('spin');
  if (typeof showLoadingOverlay === 'function') showLoadingOverlay('Chargement Restauration…');
  google.script.run
    .withSuccessHandler(function(res){
      if (typeof hideLoadingOverlay === 'function') hideLoadingOverlay();
      if (btn) btn.classList.remove('spin');
      rstIngest(res);
    })
    .withFailureHandler(function(err){
      if (typeof hideLoadingOverlay === 'function') hideLoadingOverlay();
      if (btn) btn.classList.remove('spin');
      rstShowEmpty('Erreur de chargement : ' + (err && err.message ? err.message : err));
    })
    .getRestauData(!!force);
}
window.loadRestauData = function(){ rstLoad(false); };

function rstShowEmpty(msg){
  rEl('rstEmpty').style.display = 'block';
  rEl('rstEmptyMsg').textContent = msg;
  rEl('rstBody').style.display = 'none';
}

function rstKey(ind, s){
  var n = ind.toLowerCase();
  if (s === 'Entité') {
    if (n.indexOf('montant contrat') === 0) return 'eMnt';
    if (n.indexOf('montant facturé') === 0) return 'eFac';
    if (n.indexOf('lignes en écart') === 0) return 'eLig';
    if (n.indexOf('écart') === 0) return 'eEc';
    if (n.indexOf('nuitées') === 0) return 'eNui';
    return null;
  }
  if (n.indexOf('activité') === 0) return 'act';
  if (n === 'repas patients hors collations') return 'rep';
  if (n === 'collations') return 'col';
  if (n === 'menus améliorés') return 'men';
  if (n === 'montant contrat ht') return 'mnt';
  if (n === 'jours saisis') return 'js';
  if (n === 'saisi par') return 'par';
  return null;
}

function rstIngest(res){
  if (!res || res.error) { rstShowEmpty(res && res.error ? res.error : 'Aucune réponse du serveur.'); return; }
  var rows = res.rows || [];
  var ix = {}, order = {}, hasNum = false;
  rows.forEach(function(r){
    var k = rstKey(r.i, r.s); if (!k) return;
    ix[r.e] = ix[r.e] || {}; order[r.e] = order[r.e] || [];
    if (!ix[r.e][r.s]) { ix[r.e][r.s] = {}; if (r.s !== 'Entité') order[r.e].push(r.s); }
    var t = ix[r.e][r.s];
    t[k] = r.v;
    if (k === 'act') t.unit = r.u || (/passage/i.test(r.i) ? 'Passages' : 'Nuitées');
    if (k !== 'par') r.v.forEach(function(x){ if (typeof x === 'number') hasNum = true; });
  });
  RST.ix = ix; RST.order = order; RST.jours = res.jours || [31,30,31]; RST.annee = res.annee || 2026;
  RST.userEntity = res.userEntity || 'ALL'; RST.t = Date.now();
  var p = String(res.today || '').split('-');
  RST.today = p.length === 3 ? new Date(+p[0], +p[1]-1, +p[2]) : new Date();
  rEl('rstLastUpdate').textContent = "Date d'actualisation : " + (res.updated || '--') + (res.fromCache ? ' (cache)' : '');

  if (!rows.length || !hasNum) {
    rstShowEmpty("La feuille BDD RESTAU ne renvoie aucune valeur. Vérifiez dans « Reporting Region Centre 2026 » que les liens de LIEN RESTAU sont renseignés et que l'accès IMPORTRANGE est autorisé pour chaque fichier mensuel.");
    return;
  }
  rEl('rstEmpty').style.display = 'none';
  rEl('rstBody').style.display = 'block';

  // Listes de filtres
  var ents = RST_ENT_ORDER.filter(function(e){ return ix[e]; });
  Object.keys(ix).forEach(function(e){ if (ents.indexOf(e) < 0) ents.push(e); });
  var se = rEl('rstFilterEnt'), curE = RST.ent;
  se.innerHTML = '<option value="">TOUTES</option>' + ents.map(function(e){ return '<option value="'+e+'">'+e+' · '+(RST_CITY[e]||'')+'</option>'; }).join('');
  if (ents.length === 1) { se.value = ents[0]; RST.ent = ents[0]; se.disabled = true; } else { se.disabled = false; se.value = curE; }
  var svcs = [];
  ents.forEach(function(e){ order[e].forEach(function(s){ if (svcs.indexOf(s) < 0) svcs.push(s); }); });
  var ss = rEl('rstFilterSvc'), curS = RST.svc;
  ss.innerHTML = '<option value="">TOUS</option>' + svcs.map(function(s){ return '<option value="'+rEsc(s)+'">'+rEsc(rShort(s))+'</option>'; }).join('');
  ss.value = curS;
  rstRender();
}

/* ---------- Filtres ---------- */
function rstSetPeriod(p){
  RST.period = p;
  var bs = document.querySelectorAll('#rstSeg button');
  for (var i = 0; i < bs.length; i++) bs[i].classList.toggle('active', bs[i].getAttribute('data-p') === p);
  rstRender();
}
function rstApplyFilters(){ RST.ent = rEl('rstFilterEnt').value; RST.svc = rEl('rstFilterSvc').value; rstRender(); }
function rstReset(){
  RST.period = 'T4'; RST.svc = '';
  if (!rEl('rstFilterEnt').disabled) RST.ent = '';
  rEl('rstFilterEnt').value = RST.ent; rEl('rstFilterSvc').value = ''; rEl('rstSearch').value = '';
  var bs = document.querySelectorAll('#rstSeg button');
  for (var i = 0; i < bs.length; i++) bs[i].classList.toggle('active', bs[i].getAttribute('data-p') === 'T4');
  rstRender();
}

/* ---------- Calculs ---------- */
function rMs(){ return RST.period === 'T4' ? [0,1,2] : [parseInt(RST.period,10)]; }
function rSum(arr, ms){
  if (!arr) return null;
  var t = 0, any = false;
  ms.forEach(function(m){ if (typeof arr[m] === 'number') { t += arr[m]; any = true; } });
  return any ? t : null;
}
function rLastPar(arr, ms){
  if (!arr) return '';
  for (var i = ms.length - 1; i >= 0; i--) if (typeof arr[ms[i]] === 'string' && arr[ms[i]]) return arr[ms[i]];
  return '';
}
function rElapsed(m){
  var start = new Date(RST.annee, 9 + m, 1);
  var d = Math.floor((RST.today - start) / 86400000) + 1;
  return Math.max(0, Math.min(RST.jours[m], d));
}
function rDays(ms){ var t = 0; ms.forEach(function(m){ t += RST.jours[m]; }); return t; }
function rExp(ms){ var t = 0; ms.forEach(function(m){ t += rElapsed(m); }); return t; }
function rStatus(js, exp){ if (exp === 0) return 'future'; if (!js) return 'none'; return js >= exp * RST_TOL ? 'ok' : 'late'; }
var RST_ST = { ok:'À jour', late:'En retard', none:'Non saisi', future:'À venir', na:'—' };

function rSvc(e, s, ms){
  var t = RST.ix[e][s], days = rDays(ms), exp = rExp(ms);
  var a = { e:e, s:s, hs:(s==='Hors service'), unit:t.unit||'', act:rSum(t.act,ms), rep:rSum(t.rep,ms), col:rSum(t.col,ms),
            men:rSum(t.men,ms), mnt:rSum(t.mnt,ms), js:rSum(t.js,ms)||0, par:rLastPar(t.par,ms), days:days, exp:exp };
  a.pass = /passage/i.test(a.unit);
  a.taux = exp ? Math.min(1, a.js / exp) : 0; // taux = jours saisis / jours écoulés
  a.st = rStatus(a.js, exp);
  a.ratio = (a.act > 0 && a.rep !== null) ? a.rep / a.act : null;
  a.cout  = (a.act > 0 && a.mnt > 0) ? a.mnt / a.act : null;
  return a;
}
function rEnts(all){
  var ents = RST_ENT_ORDER.filter(function(e){ return RST.ix[e]; });
  Object.keys(RST.ix).forEach(function(e){ if (ents.indexOf(e) < 0) ents.push(e); });
  return all || !RST.ent ? ents : ents.filter(function(e){ return e === RST.ent; });
}
function rPairs(ms, ignoreEnt){
  var out = [];
  rEnts(ignoreEnt).forEach(function(e){
    RST.order[e].forEach(function(s){ if (RST.svc && s !== RST.svc) return; out.push(rSvc(e, s, ms)); });
  });
  return out;
}
// Agrégat du périmètre filtré
function rCompute(ms, ignoreEnt){
  var P = rPairs(ms, ignoreEnt), ents = rEnts(ignoreEnt);
  var c = { nui:null, pas:null, rep:null, repN:null, repP:null, col:null, men:null, mnt:null, fac:null, ec:null, lig:null,
            js:0, days:rDays(ms), exp:rExp(ms), slots:0, nbNone:0, nbLate:0, nbOk:0, n:P.length, P:P };
  function add(k, v){ if (v === null || v === undefined) return; c[k] = (c[k] || 0) + v; }
  P.forEach(function(a){
    if (!a.hs) {
      if (a.pass) add('pas', a.act); else add('nui', a.act);
      add('rep', a.rep); add('col', a.col); add('men', a.men);
      if (a.pass) add('repP', a.rep); else add('repN', a.rep);
    }
    c.js += a.js; c.slots++;
    if (a.st === 'none') c.nbNone++; else if (a.st === 'late') c.nbLate++; else if (a.st === 'ok') c.nbOk++;
  });
  if (!RST.svc) {
    ents.forEach(function(e){
      var t = RST.ix[e]['Entité'] || {};
      var m = rSum(t.eMnt, ms);
      if (m === null) { RST.order[e].forEach(function(s){ add('mnt', rSum(RST.ix[e][s].mnt, ms)); }); }
      else add('mnt', m);
      add('fac', rSum(t.eFac, ms)); add('ec', rSum(t.eEc, ms)); add('lig', rSum(t.eLig, ms));
    });
  } else {
    P.forEach(function(a){ add('mnt', a.mnt); });
  }
  c.mode = (c.nui > 0 || !(c.pas > 0)) ? 'n' : 'p';
  c.act  = c.mode === 'n' ? c.nui : c.pas;
  c.repM = c.mode === 'n' ? c.repN : c.repP;
  c.ratio = (c.act > 0 && c.repM !== null) ? c.repM / c.act : null;
  c.cout  = (c.act > 0 && c.mnt > 0) ? c.mnt / c.act : null;
  c.taux  = (c.slots && c.exp) ? Math.min(1, c.js / (c.slots * c.exp)) : 0;
  c.has   = (c.act !== null || c.rep !== null || c.mnt !== null);
  return c;
}

/* ---------- Rendu principal ---------- */
function rstRender(){
  if (!RST.ix) return;
  var ms = rMs(), c = rCompute(ms);
  rstKpis(c, ms);
  rstHeat(ms);
  rstLeaderboard(ms);
  rstInsights(ms, c);
  rstCharts(ms, c);
  rstRenderTable();
}

/* ---------- KPI ---------- */
function rCount(el, to, fmt){
  if (!el) return;
  if (to === null || to === undefined || isNaN(to)) { el.textContent = '—'; el._v = null; return; }
  var from = (typeof el._v === 'number') ? el._v : 0, t0 = performance.now(), dur = 700;
  el._v = to;
  function step(t){
    var k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    el.innerHTML = fmt(from + (to - from) * e);
    if (k < 1) requestAnimationFrame(step); else el.innerHTML = fmt(to);
  }
  requestAnimationFrame(step);
}
function rDelta(cur, prev, invertGood){
  if (cur === null || prev === null || !(prev > 0)) return '';
  var d = (cur - prev) / prev, cls = Math.abs(d) < 0.005 ? 'eq' : ((d > 0) !== !!invertGood ? 'up' : 'dn');
  return '<span class="rst-delta ' + cls + '">' + (d >= 0 ? '▲ ' : '▼ ') + Math.abs(Math.round(d * 100)) + ' %</span>';
}
function rstKpis(c, ms){
  var m = ms.length === 1 ? ms[0] : -1, prev = m > 0 ? rCompute([m-1]) : null, pv = prev && prev.has ? prev : null;
  var u = c.mode === 'n' ? 'nuitée' : 'passage';
  var per = m < 0 ? 'Cumul T4' : RST_MOIS[m];
  var vs = m > 0 ? ' vs ' + RST_MOIS[m-1].toLowerCase() : '';

  document.querySelector('#rK1').parentNode.querySelector('.t').textContent = c.mode === 'n' ? 'Nuitées' : 'Passages';
  rCount(rEl('rK1'), c.act, rInt);
  rEl('rK1s').innerHTML = (pv ? rDelta(c.act, pv.act) + vs : per) + (c.mode === 'n' && c.pas > 0 ? '<br>Passages HDJ / chimio : ' + rInt(c.pas) : '');

  rCount(rEl('rK2'), c.rep, rInt);
  rEl('rK2s').innerHTML = (pv ? rDelta(c.rep, pv.rep) + vs + '<br>' : '') + 'Collations : ' + rInt(c.col) + ' · Menus améliorés : ' + rInt(c.men);

  document.querySelector('#rK3').parentNode.querySelector('.t').textContent = 'Repas par ' + u;
  rCount(rEl('rK3'), c.ratio, function(x){ return rDec(x, 2); });
  rEl('rK3s').innerHTML = c.ratio === null ? 'Hors collations' : 'Repas patients hors collations / ' + u;

  rCount(rEl('rK4'), c.mnt, function(x){ return rMad(x) + '<small>MAD</small>'; });
  var ecTxt = '';
  if (!RST.svc) {
    ecTxt = 'Facturé HT : ' + rMad(c.fac) + (c.ec !== null && c.fac ? '<br>Écart : <b style="color:' + (c.ec > 0 ? '#ef4444' : '#10b981') + '">' + (c.ec > 0 ? '+' : '') + rMad(c.ec) + ' MAD</b>' + (c.lig ? ' · ' + rInt(c.lig) + ' ligne(s)' : '') : '');
  } else ecTxt = 'Facturation disponible au niveau entité';
  rEl('rK4s').innerHTML = (pv ? rDelta(c.mnt, pv.mnt, true) + vs + '<br>' : '') + ecTxt;

  document.querySelector('#rK5').parentNode.querySelector('.t').textContent = 'Coût HT par ' + u;
  rCount(rEl('rK5'), c.cout, function(x){ return rDec(x, 1) + '<small>MAD</small>'; });
  rEl('rK5s').innerHTML = (pv && pv.cout ? rDelta(c.cout, pv.cout, true) + vs : (c.cout === null ? 'En attente de grille tarifaire / activité' : 'Contrat HT / activité'));

  rCount(rEl('rK6'), c.taux * 100, function(x){ return Math.round(x) + '<small>%</small>'; });
  var col = c.exp === 0 ? '#94a3b8' : (c.taux >= RST_TOL ? '#10b981' : (c.taux > 0 ? '#f59e0b' : '#ef4444'));
  rEl('rK6c').style.setProperty('--c', col);
  var ring = rEl('rRing'); ring.setAttribute('stroke', col);
  ring.setAttribute('stroke-dashoffset', String(150.8 * (1 - Math.min(1, c.taux))));
  rEl('rK6s').innerHTML = 'Jours saisis / jours écoulés (' + c.exp + ' j)<br>' + c.nbOk + ' à jour · ' + c.nbLate + ' en retard · ' + c.nbNone + ' non saisi';
}

/* ---------- Pulse de saisie ---------- */
function rstHeat(ms){
  var ents = rEnts(), cols = [];
  ents.forEach(function(e){ RST.order[e].forEach(function(s){ if (RST.svc && s !== RST.svc) return; if (cols.indexOf(s) < 0) cols.push(s); }); });
  // Hors service en dernier
  cols.sort(function(a, b){ return (a === 'Hors service') - (b === 'Hors service'); });
  var h = '<table><thead><tr><th></th>' + cols.map(function(s){ return '<th title="' + rEsc(s) + '">' + rEsc(rShort(s)) + '</th>'; }).join('') + '<th>Global</th></tr></thead><tbody>';
  ents.forEach(function(e){
    h += '<tr><th class="row">' + e + '<small>' + (RST_CITY[e] || '') + '</small></th>';
    var js = 0, slots = 0, days = rDays(ms);
    cols.forEach(function(s){
      if (!RST.ix[e][s]) { h += '<td><div class="rst-cell na">·</div></td>'; return; }
      var a = rSvc(e, s, ms); js += a.js; slots++;
      var tip = e + ' · ' + s + ' — ' + a.js + ' / ' + a.days + ' j saisis (attendu ' + a.exp + ') · ' + RST_ST[a.st] + (a.par ? ' · ' + a.par : '');
      h += '<td><div class="rst-cell ' + a.st + '" data-e="' + e + '" data-s="' + rEsc(s) + '" title="' + rEsc(tip) + '">' + (a.st === 'future' ? '—' : Math.round(a.taux * 100) + '%') + '</div></td>';
    });
    var tg = (slots && rExp(ms)) ? Math.min(1, js / (slots * rExp(ms))) : 0, sg = rStatus(js / Math.max(1, slots), rExp(ms));
    h += '<td><div class="rst-cell ' + sg + '" style="cursor:default" title="Global ' + e + '">' + (sg === 'future' ? '—' : Math.round(tg * 100) + '%') + '</div></td></tr>';
  });
  h += '</tbody></table>';
  var box = rEl('rstHeat'); box.innerHTML = h;
  box.onclick = function(ev){
    var c = ev.target.closest ? ev.target.closest('[data-e]') : null;
    if (c) rstOpen(c.getAttribute('data-e'), c.getAttribute('data-s'));
  };
}

function rstLeaderboard(ms){
  var days = rDays(ms), exp = rExp(ms), list = [];
  rEnts().forEach(function(e){
    var js = 0, slots = 0, ok = 0, par = '';
    RST.order[e].forEach(function(s){
      if (RST.svc && s !== RST.svc) return;
      var a = rSvc(e, s, ms); js += a.js; slots++; if (a.st === 'ok') ok++; if (a.par) par = a.par;
    });
    list.push({ e:e, taux:(slots && exp) ? Math.min(1, js / (slots * exp)) : 0, ok:ok, slots:slots, par:par, st:rStatus(js / Math.max(1, slots), exp) });
  });
  list.sort(function(a, b){ return b.taux - a.taux; });
  var h = '';
  list.forEach(function(x, i){
    var col = x.st === 'ok' ? '#10b981' : x.st === 'late' ? '#f59e0b' : x.st === 'none' ? '#ef4444' : '#94a3b8';
    h += '<div class="rst-lb-row" data-ent="' + x.e + '"><div class="rst-lb-top"><span>' + (i+1) + '. ' + x.e + ' <small>' + (RST_CITY[x.e]||'') + '</small></span><span class="rst-chip ' + x.st + '">' + RST_ST[x.st] + ' · ' + Math.round(x.taux*100) + ' %</span></div>' +
         '<div class="rst-bar"><i style="width:0;background:' + col + '" data-w="' + Math.round(x.taux*100) + '"></i><b style="left:' + Math.round(RST_TOL*100) + '%" title="Seuil À jour"></b></div>' +
         '<div class="rst-lb-meta"><span>' + x.ok + '/' + x.slots + ' services à jour</span><span>' + (x.par ? 'Dernière saisie : ' + rEsc(x.par) : 'Aucune saisie') + '</span></div></div>';
  });
  var box = rEl('rstLb'); box.innerHTML = h || '<div class="rst-sub">Aucune entité.</div>';
  setTimeout(function(){ var bars = box.querySelectorAll('.rst-bar i'); for (var i = 0; i < bars.length; i++) bars[i].style.width = bars[i].getAttribute('data-w') + '%'; }, 40);
  box.onclick = function(ev){
    var r = ev.target.closest ? ev.target.closest('.rst-lb-row') : null;
    if (r && !rEl('rstFilterEnt').disabled) { RST.ent = (RST.ent === r.getAttribute('data-ent')) ? '' : r.getAttribute('data-ent'); rEl('rstFilterEnt').value = RST.ent; rstRender(); }
  };
}

/* ---------- Synthèse ---------- */
function rMedian(a){ if (!a.length) return null; a = a.slice().sort(function(x, y){ return x - y; }); var m = Math.floor(a.length / 2); return a.length % 2 ? a[m] : (a[m-1] + a[m]) / 2; }
function rstMedians(ms){
  var by = {};
  rPairs(ms, true).forEach(function(a){
    if (a.hs) return;
    var o = by[a.s] = by[a.s] || { r:[], c:[] };
    if (a.ratio !== null) o.r.push(a.ratio);
    if (a.cout !== null) o.c.push(a.cout);
  });
  var med = {};
  Object.keys(by).forEach(function(s){ med[s] = { r: by[s].r.length >= 3 ? rMedian(by[s].r) : null, c: by[s].c.length >= 3 ? rMedian(by[s].c) : null }; });
  return med;
}
function rstInsights(ms, c){
  var out = [], P = c.P;
  function add(cls, ico, txt){ out.push('<div class="rst-ins ' + cls + '" style="animation-delay:' + (out.length * .06) + 's"><i class="fas ' + ico + '"></i><div>' + txt + '</div></div>'); }
  if (c.exp === 0) {
    add('info', 'fa-calendar', 'Le mois sélectionné n\'a pas encore démarré : le suivi de saisie sera disponible à partir du 1er jour.');
  } else {
    var none = P.filter(function(a){ return a.st === 'none'; });
    var late = P.filter(function(a){ return a.st === 'late'; });
    if (none.length) add('bad', 'fa-circle-exclamation', '<b>' + none.length + ' service(s) sans aucune saisie</b> alors que ' + c.exp + ' jour(s) sont écoulés : ' + none.slice(0, 5).map(function(a){ return a.e + ' ' + rShort(a.s); }).join(', ') + (none.length > 5 ? ' et ' + (none.length - 5) + ' autre(s)' : '') + '.');
    if (late.length) add('warn', 'fa-clock', '<b>' + late.length + ' service(s) en retard</b> de saisie : ' + late.slice(0, 5).map(function(a){ return a.e + ' ' + rShort(a.s) + ' (' + a.js + '/' + a.exp + ' j)'; }).join(', ') + (late.length > 5 ? '…' : '') + '.');
    if (!none.length && !late.length) add('ok', 'fa-circle-check', '<b>Saisie à jour</b> sur l\'ensemble du périmètre (' + c.nbOk + ' service(s)).');
  }
  // Coûts par entité
  var cmp = rstEntCosts(ms);
  if (cmp.list.length >= 2 && cmp.avg) {
    var hi = cmp.list[0], lo = cmp.list[cmp.list.length - 1];
    add('info', 'fa-coins', 'Coût HT par nuitée le plus élevé : <b>' + hi.e + '</b> (' + rDec(hi.v, 1) + ' MAD, ' + (hi.v >= cmp.avg ? '+' : '') + Math.round((hi.v / cmp.avg - 1) * 100) + ' % vs moyenne régionale de ' + rDec(cmp.avg, 1) + ' MAD) ; le plus bas : <b>' + lo.e + '</b> (' + rDec(lo.v, 1) + ' MAD).');
  }
  if (c.ec !== null && c.fac && !RST.svc) {
    add(Math.abs(c.ec) > 0.02 * (c.mnt || 1) ? 'warn' : 'ok', 'fa-file-invoice', 'Facturation : écart de <b>' + (c.ec > 0 ? '+' : '') + rInt(c.ec) + ' MAD HT</b> entre le montant facturé et le montant contrat' + (c.lig ? ' (' + rInt(c.lig) + ' ligne(s) en écart)' : '') + '.');
  }
  // Valeurs atypiques vs pairs
  var med = rstMedians(ms), flags = [];
  P.forEach(function(a){
    var m = med[a.s]; if (!m) return;
    if (m.r && a.ratio !== null && Math.abs(a.ratio / m.r - 1) > 0.25) flags.push(a.e + ' ' + rShort(a.s) + ' : ' + rDec(a.ratio, 2) + ' repas/' + (a.pass ? 'passage' : 'nuitée') + ' (médiane ' + rDec(m.r, 2) + ')');
  });
  if (flags.length) add('warn', 'fa-magnifying-glass-chart', '<b>Consommation atypique</b> (écart supérieur à 25 % de la médiane des entités) : ' + flags.slice(0, 4).join(' ; ') + (flags.length > 4 ? '…' : '') + '.');
  var noPrice = P.filter(function(a){ return !a.hs && a.act > 0 && !(a.mnt > 0); });
  if (noPrice.length) add('info', 'fa-tags', '<b>' + noPrice.length + ' service(s)</b> avec activité mais sans montant contrat : grille tarifaire à renseigner dans le fichier de suivi.');
  rEl('rstIns').innerHTML = out.join('');
}

/* ---------- Graphiques ---------- */
function rKill(k){ if (RST.ch[k]) { RST.ch[k].destroy(); RST.ch[k] = null; } }
function rstEntCosts(ms){
  var list = [], tm = 0, tn = 0;
  rEnts(true).forEach(function(e){
    var mnt = 0, act = 0, any = false;
    if (!RST.svc) {
      var t = RST.ix[e]['Entité'] || {}; var m = rSum(t.eMnt, ms);
      if (m === null) { RST.order[e].forEach(function(s){ var x = rSum(RST.ix[e][s].mnt, ms); if (x) m = (m||0) + x; }); }
      mnt = m || 0;
      RST.order[e].forEach(function(s){ var a = rSvc(e, s, ms); if (!a.hs && !a.pass && a.act) act += a.act; });
    } else {
      RST.order[e].forEach(function(s){ if (s !== RST.svc) return; var a = rSvc(e, s, ms); mnt += a.mnt || 0; act += a.act || 0; });
    }
    if (act > 0 && mnt > 0) { list.push({ e:e, v:mnt / act }); tm += mnt; tn += act; }
  });
  list.sort(function(a, b){ return b.v - a.v; });
  return { list:list, avg: tn ? tm / tn : null };
}
function rstCharts(ms, c){
  if (typeof Chart === 'undefined') return;
  Chart.defaults.font.family = "'Plus Jakarta Sans', sans-serif";
  var noDL = { datalabels: { display: false } };

  // 1. Tendance mensuelle
  rKill('trend');
  var tr = [0,1,2].map(function(m){ var x = rCompute([m]); return rElapsed(m) === 0 ? null : x; });
  RST.ch.trend = new Chart(rEl('rstChTrend'), {
    data: { labels: RST_MOIS, datasets: [
      { type:'bar',  label:'Nuitées', data: tr.map(function(x){ return x && x.nui !== null ? x.nui : null; }), backgroundColor:'rgba(14,165,233,.8)', borderRadius:8, yAxisID:'y', order:3 },
      { type:'line', label:'Repas patients', data: tr.map(function(x){ return x && x.rep !== null ? x.rep : null; }), borderColor:'#6366f1', backgroundColor:'#6366f1', borderWidth:3, tension:.35, pointRadius:5, yAxisID:'y', order:2 },
      { type:'line', label:'Coût HT / nuitée (MAD)', data: tr.map(function(x){ return x && x.mode === 'n' && x.cout !== null ? x.cout : null; }), borderColor:'#f59e0b', backgroundColor:'#f59e0b', borderWidth:3, borderDash:[6,4], tension:.35, pointRadius:5, yAxisID:'y1', order:1 }
    ] },
    options: { responsive:true, maintainAspectRatio:false, interaction:{ mode:'index', intersect:false },
      plugins: { legend:{ position:'bottom', labels:{ usePointStyle:true, font:{ weight:'700' } } }, datalabels:{ display:false },
        tooltip:{ callbacks:{ label:function(ctx){ return ctx.dataset.label + ' : ' + rDec(ctx.parsed.y, ctx.datasetIndex === 2 ? 1 : 0).replace(/^—$/, ''); } } } },
      scales: { y:{ beginAtZero:true, grid:{ color:'#eef0f8' } }, y1:{ position:'right', beginAtZero:true, grid:{ display:false } }, x:{ grid:{ display:false } } } }
  });

  // 2. Donut montant contrat par service
  rKill('donut');
  var g = {}; c.P.forEach(function(a){ if (a.mnt > 0) g[rShort(a.s)] = (g[rShort(a.s)] || 0) + a.mnt; });
  var ks = Object.keys(g).sort(function(a, b){ return g[b] - g[a]; }), lab = [], val = [], oth = 0;
  ks.forEach(function(k, i){ if (i < 7) { lab.push(k); val.push(g[k]); } else oth += g[k]; });
  if (oth > 0) { lab.push('Autres'); val.push(oth); }
  var tot = val.reduce(function(s, x){ return s + x; }, 0);
  RST.ch.donut = new Chart(rEl('rstChDonut'), {
    type:'doughnut',
    data:{ labels: lab, datasets:[{ data: val, backgroundColor: RST_PAL, borderColor:'#fff', borderWidth:3, hoverOffset:10 }] },
    options:{ responsive:true, maintainAspectRatio:false, cutout:'66%',
      plugins:{ legend:{ position:'right', labels:{ usePointStyle:true, font:{ size:11, weight:'700' } } }, datalabels:{ display:false },
        tooltip:{ callbacks:{ label:function(ctx){ return ' ' + ctx.label + ' : ' + rInt(ctx.parsed) + ' MAD (' + Math.round(ctx.parsed / tot * 100) + ' %)'; } } } } },
    plugins:[{ id:'rstCenter', afterDraw:function(ch){
      if (!tot) return; var a = ch.chartArea, cx = (a.left + a.right) / 2, cy = (a.top + a.bottom) / 2, x = ch.ctx;
      x.save(); x.textAlign = 'center'; x.fillStyle = '#1e293b'; x.font = "900 20px 'Plus Jakarta Sans'"; x.fillText(rMad(tot), cx, cy + 2);
      x.fillStyle = '#94a3b8'; x.font = "700 11px 'Plus Jakarta Sans'"; x.fillText('MAD HT', cx, cy + 18); x.restore(); } }]
  });

  // 3. Comparaison entités
  rKill('cmp');
  var cc = rstEntCosts(ms);
  rEl('rstCmpSub').textContent = cc.avg ? 'Moyenne régionale : ' + rDec(cc.avg, 1) + ' MAD · Vert : sous la moyenne · Orange : au-dessus' : 'Disponible dès que activité et montant contrat sont renseignés';
  RST.ch.cmp = new Chart(rEl('rstChCmp'), {
    type:'bar',
    data:{ labels: cc.list.map(function(x){ return x.e + ' · ' + (RST_CITY[x.e] || ''); }),
      datasets:[{ data: cc.list.map(function(x){ return x.v; }), borderRadius:8,
        backgroundColor: cc.list.map(function(x){ return !cc.avg ? '#6366f1' : x.v > cc.avg * 1.05 ? '#f59e0b' : x.v < cc.avg * .95 ? '#10b981' : '#6366f1'; }) }] },
    options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{ display:false }, datalabels:{ display:false }, tooltip:{ callbacks:{ label:function(ctx){ return ' ' + rDec(ctx.parsed.x, 1) + ' MAD / nuitée'; } } } },
      scales:{ x:{ beginAtZero:true, grid:{ color:'#eef0f8' } }, y:{ grid:{ display:false } } } },
    plugins:[{ id:'rstAvg', afterDatasetsDraw:function(ch){
      if (!cc.avg) return; var x = ch.scales.x.getPixelForValue(cc.avg), a = ch.chartArea, k = ch.ctx;
      k.save(); k.setLineDash([6,4]); k.strokeStyle = '#1e293b'; k.lineWidth = 1.5; k.beginPath(); k.moveTo(x, a.top); k.lineTo(x, a.bottom); k.stroke(); k.restore(); } }]
  });

  // 4. Mix de consommation
  rKill('mix');
  var mx = {}; c.P.forEach(function(a){ if (a.hs) return; var k = rShort(a.s); mx[k] = mx[k] || { r:0, c:0, m:0 }; mx[k].r += a.rep || 0; mx[k].c += a.col || 0; mx[k].m += a.men || 0; });
  var mk = Object.keys(mx).filter(function(k){ return mx[k].r + mx[k].c + mx[k].m > 0; }).sort(function(a, b){ return (mx[b].r + mx[b].c + mx[b].m) - (mx[a].r + mx[a].c + mx[a].m); }).slice(0, 12);
  RST.ch.mix = new Chart(rEl('rstChMix'), {
    type:'bar',
    data:{ labels: mk, datasets:[
      { label:'Repas patients', data: mk.map(function(k){ return mx[k].r; }), backgroundColor:'#6366f1', borderRadius:4 },
      { label:'Collations', data: mk.map(function(k){ return mx[k].c; }), backgroundColor:'#0ea5e9', borderRadius:4 },
      { label:'Menus améliorés', data: mk.map(function(k){ return mx[k].m; }), backgroundColor:'#f59e0b', borderRadius:4 } ] },
    options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{ position:'bottom', labels:{ usePointStyle:true, font:{ weight:'700' } } }, datalabels:{ display:false } },
      scales:{ x:{ stacked:true, grid:{ color:'#eef0f8' } }, y:{ stacked:true, grid:{ display:false } } } }
  });
}

/* ---------- Tableau ---------- */
var RST_COLS = [
  { k:'e', t:'Entité', l:1 }, { k:'s', t:'Service', l:1 }, { k:'act', t:'Activité' }, { k:'rep', t:'Repas' }, { k:'ratio', t:'Repas / unité' },
  { k:'col', t:'Collations' }, { k:'men', t:'Menus amél.' }, { k:'mnt', t:'Contrat HT (MAD)' }, { k:'cout', t:'Coût HT / unité' },
  { k:'taux', t:'Saisie' }, { k:'par', t:'Saisi par', l:1 }, { k:'st', t:'Statut', l:1 }
];
function rstRenderTable(){
  if (!RST.ix) return;
  var ms = rMs(), P = rPairs(ms), q = (rEl('rstSearch').value || '').toLowerCase().trim(), med = rstMedians(ms);
  if (q) P = P.filter(function(a){ return (a.e + ' ' + a.s + ' ' + rShort(a.s)).toLowerCase().indexOf(q) > -1; });
  var k = RST.sort.k, d = RST.sort.d;
  P.sort(function(a, b){
    var x = a[k], y = b[k];
    if (x === null || x === undefined) x = (typeof y === 'string') ? '' : -Infinity;
    if (y === null || y === undefined) y = (typeof x === 'string') ? '' : -Infinity;
    if (typeof x === 'string' || typeof y === 'string') return String(x).localeCompare(String(y), 'fr') * d;
    return (x - y) * d;
  });
  rEl('rstThead').innerHTML = RST_COLS.map(function(c){
    return '<th class="' + (c.l ? 'l' : '') + '" data-k="' + c.k + '">' + c.t + '<span class="ar">' + (RST.sort.k === c.k ? (RST.sort.d > 0 ? '▲' : '▼') : '') + '</span></th>';
  }).join('');
  rEl('rstThead').onclick = function(ev){
    var th = ev.target.closest ? ev.target.closest('th') : null; if (!th) return;
    var kk = th.getAttribute('data-k'); RST.sort = { k:kk, d: RST.sort.k === kk ? -RST.sort.d : -1 }; rstRenderTable();
  };
  var h = '';
  P.forEach(function(a){
    var m = med[a.s] || {}, fr = '', fc = '';
    if (m.r && a.ratio !== null && Math.abs(a.ratio / m.r - 1) > 0.25) fr = '<i class="fas fa-triangle-exclamation rst-flag" title="Écart > 25 % vs médiane des entités (' + rDec(m.r, 2) + ')"></i>';
    if (m.c && a.cout !== null && Math.abs(a.cout / m.c - 1) > 0.25) fc = '<i class="fas fa-triangle-exclamation rst-flag" title="Écart > 25 % vs médiane des entités (' + rDec(m.c, 1) + ' MAD)"></i>';
    var col = a.st === 'ok' ? '#10b981' : a.st === 'late' ? '#f59e0b' : a.st === 'none' ? '#ef4444' : '#cbd5e1';
    h += '<tr class="dr" data-e="' + a.e + '" data-s="' + rEsc(a.s) + '">' +
      '<td class="l"><span class="rst-ent" style="background:' + (RST_COLOR[a.e] || '#64748b') + '">' + a.e + '</span></td>' +
      '<td class="l sv">' + rEsc(rShort(a.s)) + '</td>' +
      '<td>' + (a.hs ? '—' : rInt(a.act) + ' <small style="color:#94a3b8">' + (a.pass ? 'pass.' : 'nuit.') + '</small>') + '</td>' +
      '<td>' + (a.hs ? '—' : rInt(a.rep)) + '</td><td>' + rDec(a.ratio, 2) + fr + '</td>' +
      '<td>' + (a.hs ? '—' : rInt(a.col)) + '</td><td>' + (a.hs ? '—' : rInt(a.men)) + '</td>' +
      '<td>' + rInt(a.mnt) + '</td><td>' + rDec(a.cout, 1) + fc + '</td>' +
      '<td><span class="rst-mini"><i style="width:' + Math.round(Math.min(1, a.taux) * 100) + '%;background:' + col + '"></i></span>' + Math.round(a.taux * 100) + ' %</td>' +
      '<td class="l">' + rEsc(a.par || '—') + '</td>' +
      '<td class="l"><span class="rst-chip ' + a.st + '">' + RST_ST[a.st] + '</span></td></tr>';
  });
  rEl('rstTbody').innerHTML = h || '<tr><td colspan="12" style="text-align:center;padding:30px;color:#94a3b8">Aucune ligne</td></tr>';
  rEl('rstCount').textContent = P.length + ' ligne(s)';
  rEl('rstTbody').onclick = function(ev){
    var tr = ev.target.closest ? ev.target.closest('tr.dr') : null;
    if (tr) rstOpen(tr.getAttribute('data-e'), tr.getAttribute('data-s'));
  };
}

/* ---------- Détail service ---------- */
function rstOpen(e, s){
  if (!RST.ix || !RST.ix[e] || !RST.ix[e][s]) return;
  var a = rSvc(e, s, rMs()), t = RST.ix[e][s];
  rEl('rstMTitle').textContent = e + ' · ' + (RST_CITY[e] || '') + ' — ' + s;
  rEl('rstMGrid').innerHTML =
    '<div class="rst-mm"><b>' + (a.pass ? 'Passages' : 'Nuitées') + '</b><span>' + (a.hs ? '—' : rInt(a.act)) + '</span></div>' +
    '<div class="rst-mm"><b>Repas patients</b><span>' + (a.hs ? '—' : rInt(a.rep)) + '</span></div>' +
    '<div class="rst-mm"><b>Repas / ' + (a.pass ? 'passage' : 'nuitée') + '</b><span>' + rDec(a.ratio, 2) + '</span></div>' +
    '<div class="rst-mm"><b>Contrat HT</b><span>' + rInt(a.mnt) + ' MAD</span></div>' +
    '<div class="rst-mm"><b>Coût HT / unité</b><span>' + rDec(a.cout, 1) + '</span></div>' +
    '<div class="rst-mm"><b>Saisie</b><span>' + a.js + ' / ' + a.exp + ' j <small>(' + RST_ST[a.st] + ')</small></span></div>';
  var par = [0,1,2].map(function(m){ var p = (t.par && typeof t.par[m] === 'string') ? t.par[m] : ''; return RST_MOIS[m] + ' : ' + (p || '—'); }).join('  ·  ');
  rEl('rstMPar').innerHTML = '<i class="fas fa-user-pen" style="margin-right:6px;color:#6366f1"></i>Saisi par — ' + rEsc(par);
  rEl('rstModal').style.display = 'flex';
  rKill('modal');
  if (typeof Chart === 'undefined') return;
  function mv(arr, m){ return arr && typeof arr[m] === 'number' ? arr[m] : null; }
  RST.ch.modal = new Chart(rEl('rstChModal'), {
    data:{ labels: RST_MOIS, datasets:[
      { type:'bar', label:(a.pass ? 'Passages' : 'Nuitées'), data:[0,1,2].map(function(m){ return mv(t.act, m); }), backgroundColor:'rgba(14,165,233,.8)', borderRadius:8 },
      { type:'bar', label:'Repas patients', data:[0,1,2].map(function(m){ return mv(t.rep, m); }), backgroundColor:'rgba(99,102,241,.85)', borderRadius:8 },
      { type:'line', label:'Taux de saisie (%)', data:[0,1,2].map(function(m){ var j = mv(t.js, m); return (j === null || rElapsed(m) === 0) ? null : Math.round(Math.min(1, j / Math.max(1, rElapsed(m))) * 100); }), borderColor:'#10b981', backgroundColor:'#10b981', borderWidth:3, tension:.3, pointRadius:5, yAxisID:'y1' } ] },
    options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ position:'bottom', labels:{ usePointStyle:true, font:{ weight:'700' } } }, datalabels:{ display:false } },
      scales:{ y:{ beginAtZero:true, grid:{ color:'#eef0f8' } }, y1:{ position:'right', min:0, max:100, grid:{ display:false } }, x:{ grid:{ display:false } } } }
  });
}
function rstCloseModal(){ rEl('rstModal').style.display = 'none'; rKill('modal'); }
document.addEventListener('keydown', function(ev){ if (ev.key === 'Escape') rstCloseModal(); });

/* ---------- Export ---------- */
function rstExport(){
  if (!RST.ix) return;
  var ms = rMs(), P = rPairs(ms);
  var rows = [['Entité','Service','Unité','Activité','Repas hors collations','Repas / unité','Collations','Menus améliorés','Contrat HT (MAD)','Coût HT / unité','Jours saisis','Jours période','Taux de saisie','Saisi par','Statut']];
  P.forEach(function(a){ rows.push([a.e, a.s, a.pass ? 'Passages' : 'Nuitées', a.act, a.rep, a.ratio, a.col, a.men, a.mnt, a.cout, a.js, a.days, Math.round(a.taux * 1000) / 10, a.par, RST_ST[a.st]]); });
  var mrows = [['Entité','Service','Mois','Activité','Repas hors collations','Collations','Menus améliorés','Contrat HT (MAD)','Jours saisis','Saisi par']];
  rEnts().forEach(function(e){ RST.order[e].forEach(function(s){
    if (RST.svc && s !== RST.svc) return; var t = RST.ix[e][s];
    [0,1,2].forEach(function(m){ function g(arr){ return arr && typeof arr[m] === 'number' ? arr[m] : ''; }
      mrows.push([e, s, RST_MOIS[m], g(t.act), g(t.rep), g(t.col), g(t.men), g(t.mnt), g(t.js), t.par && typeof t.par[m] === 'string' ? t.par[m] : '']); });
  }); });
  var wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), 'Période');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(mrows), 'Mensuel');
  XLSX.writeFile(wb, 'Suivi_Restauration_' + (RST.period === 'T4' ? 'T4' : RST_MOIS[+RST.period]) + '_2026.xlsx');
}
